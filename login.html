<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>在线学习 - 登录</title>
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<meta content="" name="keywords">
<meta content="登录在线学习平台，继续你的学习之旅。" name="description">



<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
<link href="static/css/css2.css" rel="stylesheet">

<link href="static/css/all.min.css" rel="stylesheet">
<link href="static/css/bootstrap-icons.css" rel="stylesheet">

<link href="static/css/animate.min.css" rel="stylesheet">
<link href="static/css/owl.carousel.min.css" rel="stylesheet">

<link href="static/css/bootstrap.min.css" rel="stylesheet">

<link href="static/css/style.css" rel="stylesheet">
</head>
<body>

<div id="spinner" class="show bg-white position-fixed translate-middle w-100 vh-100 top-50 start-50 d-flex align-items-center justify-content-center">
<div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
<span class="sr-only">加载中...</span>
</div>
</div>


<div id="site-nav"></div>


<div class="container-fluid bg-primary py-5 mb-5 page-header">
<div class="container py-5">
<div class="row justify-content-center">
<div class="col-lg-10 col-md-12 col-sm-12 text-center">
<h1 class="display-3 text-white animated slideInDown">用户登录</h1>
<nav aria-label="breadcrumb">
<ol class="breadcrumb justify-content-center">
<li class="breadcrumb-item"><a class="text-white" href="index1.html">首页</a></li>
<li class="breadcrumb-item"><a class="text-white" href="#">更多页面</a></li>
<li class="breadcrumb-item text-white active" aria-current="page">登录</li>
</ol>
</nav>
</div>
</div>
</div>
</div>


<div class="container-xxl py-5 wow fadeInUp" data-wow-delay="0.1s">
<div class="container">
<div class="row justify-content-center">
<div class="col-lg-5 col-md-7 col-sm-9">
<div class="bg-light rounded p-4 p-sm-5">
<div class="text-center mb-4">
<h6 class="section-title bg-white text-center text-primary px-3">登录</h6>
<h1 class="mb-4">欢迎回来</h1>
</div>
<div id="loginAlert" class="alert d-none" role="alert"></div>
<form id="loginForm" autocomplete="off" novalidate>
<div class="form-floating mb-3">
<input type="text" class="form-control" id="loginEmail" placeholder="用户名 / 邮箱" required>
<label for="loginEmail">用户名 / 邮箱</label>
</div>
<div class="form-floating mb-3">
<input type="password" class="form-control" id="loginPassword" placeholder="密码" minlength="8" required>
<label for="loginPassword">密码</label>
</div>
<div class="d-flex justify-content-between align-items-center mb-4">
<div class="form-check">
<input class="form-check-input" type="checkbox" id="loginRemember">
<label class="form-check-label" for="loginRemember">记住我（30 天）</label>
</div>
<a href="register.html" class="text-primary">没有账号？免费注册</a>
</div>
<button class="btn btn-primary w-100 py-3" type="submit">登 录</button>
</form>
</div>
</div>
</div>
</div>
</div>


<div id="site-footer"></div>
<a href="#" class="btn btn-lg btn-primary btn-lg-square back-to-top"><i class="bi bi-arrow-up"></i></a>

<script src="static/js/jquery-3.4.1.min.js"></script>
<script src="static/js/bootstrap.bundle.min.js"></script>
<script src="static/js/wow.min.js"></script>
<script src="static/js/easing.min.js"></script>
<script src="static/js/waypoints.min.js"></script>
<script src="static/js/owl.carousel.min.js"></script>
<script src="static/js/main.js"></script>
<script src="static/js/auth.js" data-auth="guest"></script>
<script src="static/js/components.js"></script>
<script>
(function () {
    "use strict";

    var form = document.getElementById("loginForm");
    var emailI = document.getElementById("loginEmail");
    var pwI = document.getElementById("loginPassword");
    var rememberI = document.getElementById("loginRemember");
    var alertBox = document.getElementById("loginAlert");

    // 读取 next（回跳目标）与 email（注册页预填）
    var next = "";
    try {
        var params = new URLSearchParams(location.search);
        next = params.get("next") || "";
        var prefill = params.get("email");
        if (prefill) emailI.value = prefill;
    } catch (e) { }

    // 输入时清除上一次的自定义错误
    emailI.addEventListener("input", function () { emailI.setCustomValidity(""); });
    pwI.addEventListener("input", function () { pwI.setCustomValidity(""); });

    form.addEventListener("submit", function (e) {
        e.preventDefault();

        // 1) HTML5 原生校验（required / type=email / minlength）
        if (!form.checkValidity()) {
            form.reportValidity();
            return;
        }

        // 2) 验证凭据并建立登录态（服务端校验，错误统一提示，不暴露账号是否存在）
        var submitBtn = form.querySelector('button[type="submit"]');
        if (submitBtn) submitBtn.disabled = true;
        alertBox.className = "alert d-none";
        Auth.login(emailI.value.trim(), pwI.value, rememberI.checked).then(function (res) {
            if (submitBtn) submitBtn.disabled = false;
            if (!res.ok) {
                // 依据服务端返回的出错字段定位输入框
                var target = res.field === "username" || res.field === "email" ? emailI : pwI;
                target.setCustomValidity(res.error);
                target.reportValidity();
                target.setCustomValidity("");
                return;
            }

            // 3) 登录成功 → 回跳 next 或首页
            alertBox.className = "alert alert-success";
            alertBox.textContent = "登录成功，欢迎回来，" + res.user.name + "！正在跳转...";
            setTimeout(function () {
                location.href = Auth.safeRedirect(next, "index1.html");
            }, 900);
        });
    });
})();
</script>
</body>
</html>
