<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>在线学习 - 课程列表</title>
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<meta content="" name="keywords">
<meta content="全部课程列表：支持分类、价格、难度筛选与关键词搜索、分页浏览。" name="description">



<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
<link href="static/css/css2.css" rel="stylesheet">

<link href="static/css/all.min.css" rel="stylesheet">
<link href="static/css/bootstrap-icons.css" rel="stylesheet">

<link href="static/css/animate.min.css" rel="stylesheet">
<link href="static/css/owl.carousel.min.css" rel="stylesheet">

<link href="static/css/bootstrap.min.css" rel="stylesheet">

<link href="static/css/style.css" rel="stylesheet">
</head>
<body>

<div id="spinner" class="show bg-white position-fixed translate-middle w-100 vh-100 top-50 start-50 d-flex align-items-center justify-content-center">
<div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
<span class="sr-only">加载中...</span>
</div>
</div>


<div id="site-nav"></div>


<div class="container-fluid bg-primary py-5 mb-5 page-header">
<div class="container py-5">
<div class="row justify-content-center">
<div class="col-lg-10 col-md-12 col-sm-12 text-center">
<h1 class="display-3 text-white animated slideInDown">课程列表</h1>
<nav aria-label="breadcrumb">
<ol class="breadcrumb justify-content-center">
<li class="breadcrumb-item"><a class="text-white" href="index1.html">首页</a></li>
<li class="breadcrumb-item"><a class="text-white" href="courses.html">课程</a></li>
<li class="breadcrumb-item text-white active" aria-current="page">课程列表</li>
</ol>
</nav>
</div>
</div>
</div>
</div>


<div class="container-xxl py-5">
<div class="container">
<div class="row g-5">

<!-- 侧栏筛选（小屏折叠，大屏固定显示） -->
<div class="col-lg-3 col-md-12">
<button class="btn btn-primary w-100 py-3 mb-4 d-lg-none" type="button" data-bs-toggle="collapse" data-bs-target="#filterSidebar" aria-expanded="false" aria-controls="filterSidebar">
<i class="fa fa-sliders-h me-2"></i>筛选条件
</button>

<div class="collapse d-lg-block" id="filterSidebar">
<div class="bg-light rounded p-4 mb-4">
<h5 class="mb-3"><i class="fa fa-search text-primary me-2"></i>搜索课程</h5>
<input type="text" id="searchInput" class="form-control border-0 py-2" placeholder="课程名 / 分类 / 讲师">
</div>

<div class="bg-light rounded p-4 mb-4">
<h5 class="mb-3"><i class="fa fa-folder text-primary me-2"></i>课程分类</h5>
<div class="d-flex flex-column gap-2" id="categoryList"></div>
</div>

<div class="bg-light rounded p-4 mb-4">
<h5 class="mb-3"><i class="fa fa-tag text-primary me-2"></i>价格</h5>
<div class="d-flex flex-column gap-2" id="priceList"></div>
</div>

<div class="bg-light rounded p-4 mb-4">
<h5 class="mb-3"><i class="fa fa-signal text-primary me-2"></i>难度</h5>
<div class="d-flex flex-column gap-2" id="levelList"></div>
</div>

<div class="bg-light rounded p-4">
<h5 class="mb-3"><i class="fa fa-sort text-primary me-2"></i>排序方式</h5>
<select id="sortSelect" class="form-select border-0 py-2">
<option value="default">默认排序</option>
<option value="priceAsc">价格从低到高</option>
<option value="priceDesc">价格从高到低</option>
<option value="studentsDesc">学员数最多</option>
<option value="ratingDesc">评分最高</option>
</select>
<button type="button" id="clearBtn" class="btn btn-outline-primary w-100 py-2 mt-3"><i class="fa fa-eraser me-2"></i>清除全部筛选</button>
</div>
</div>
</div>

<!-- 课程列表区 -->
<div class="col-lg-9 col-md-12">
<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
<h4 class="mb-0">全部课程</h4>
<span class="text-muted" id="resultInfo"></span>
</div>

<!-- 空状态 -->
<div id="emptyState" class="text-center bg-light rounded p-5 d-none">
<i class="fa fa-search fa-4x text-muted mb-4"></i>
<h5 class="mb-3">没有找到课程</h5>
<p class="text-muted mb-4">换个关键词，或清除部分筛选条件再试试。</p>
<button type="button" id="emptyClearBtn" class="btn btn-primary py-3 px-5"><i class="fa fa-eraser me-2"></i>清除筛选</button>
</div>

<!-- 课程卡片（复用 courses 卡片结构） -->
<div class="row g-4" id="courseGrid"></div>

<!-- 分页 -->
<nav aria-label="分页" class="mt-5">
<ul class="pagination justify-content-center" id="pagination"></ul>
</nav>
</div>

</div>
</div>
</div>


<div id="site-footer"></div>
<a href="#" class="btn btn-lg btn-primary btn-lg-square back-to-top"><i class="bi bi-arrow-up"></i></a>

<script src="static/js/jquery-3.4.1.min.js"></script>
<script src="static/js/bootstrap.bundle.min.js"></script>
<script src="static/js/wow.min.js"></script>
<script src="static/js/easing.min.js"></script>
<script src="static/js/waypoints.min.js"></script>
<script src="static/js/owl.carousel.min.js"></script>
<script src="static/js/main.js"></script>
<script src="static/js/auth.js"></script>
<script src="static/js/components.js"></script>
<script src="static/js/course-data.js"></script>
<script>
(function () {
    "use strict";

    function esc(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
    }

    var PAGE_SIZE = 3; // 演示用小页长，便于看到分页效果

    /* ========== 1) 状态对象：所有筛选条件收拢于此，统一 render() ========== */
    var state = {
        keyword: "",
        category: "all",
        price: "all",      // all | free | paid | lte150 | gt150
        level: "all",      // all | 入门 | 进阶 | 通用
        sort: "default",
        page: 1
    };

    /* ========== 2) 从 URL 恢复状态（刷新/分享链接不丢条件） ========== */
    try {
        var params = new URLSearchParams(location.search);
        /* 兼容搜索组件跳转的 ?q= 与旧参数 keyword */
        var kw = params.get("q") || params.get("keyword");
        if (kw) state.keyword = kw;
        if (params.get("category")) state.category = params.get("category");
        if (params.get("price")) state.price = params.get("price");
        if (params.get("level")) state.level = params.get("level");
        if (params.get("sort")) state.sort = params.get("sort");
        if (params.get("page")) state.page = Math.max(1, parseInt(params.get("page"), 10) || 1);
    } catch (e) { }

    /* ========== 3) 筛选选项定义 ========== */
    var CATEGORIES = [];
    CourseData.list.forEach(function (c) {
        if (CATEGORIES.indexOf(c.category) === -1) CATEGORIES.push(c.category);
    });
    var PRICES = [
        { key: "all", label: "全部价格" },
        { key: "free", label: "免费" },
        { key: "paid", label: "收费" },
        { key: "lte150", label: "¥150 及以下" },
        { key: "gt150", label: "¥150 以上" }
    ];
    var LEVELS = ["全部难度", "入门", "进阶", "通用"];

    /* ========== 4) 渲染侧栏筛选控件 ========== */
    function renderFilters() {
        // 分类（带计数）
        document.getElementById("categoryList").innerHTML = ["all"].concat(CATEGORIES).map(function (cat) {
            var n = cat === "all" ? CourseData.list.length : CourseData.list.filter(function (c) { return c.category === cat; }).length;
            var active = state.category === cat;
            return '<button type="button" class="btn btn-sm text-start ' + (active ? "btn-primary" : "btn-outline-primary") + '" data-cat="' + esc(cat) + '">'
                + esc(cat === "all" ? "全部分类" : cat) + ' <span class="ms-1">(' + n + ")</span></button>";
        }).join("");

        // 价格
        document.getElementById("priceList").innerHTML = PRICES.map(function (p) {
            var active = state.price === p.key;
            return '<button type="button" class="btn btn-sm text-start ' + (active ? "btn-primary" : "btn-outline-primary") + '" data-price="' + p.key + '">' + esc(p.label) + "</button>";
        }).join("");

        // 难度
        document.getElementById("levelList").innerHTML = LEVELS.map(function (lv, i) {
            var key = i === 0 ? "all" : lv;
            var active = state.level === key;
            return '<button type="button" class="btn btn-sm text-start ' + (active ? "btn-primary" : "btn-outline-primary") + '" data-level="' + esc(key) + '">' + esc(lv) + "</button>";
        }).join("");

        document.getElementById("sortSelect").value = state.sort;
        document.getElementById("searchInput").value = state.keyword;
    }

    /* ========== 5) 组合筛选：Array.filter 链式判断，全部满足才保留 ========== */
    function filterCourses() {
        var kw = state.keyword.trim().toLowerCase();
        return CourseData.list.filter(function (c) {
            // 关键字命中：名称 / 分类 / 讲师
            if (kw) {
                var hit = c.title.toLowerCase().indexOf(kw) !== -1
                    || c.category.toLowerCase().indexOf(kw) !== -1
                    || c.instructor.name.toLowerCase().indexOf(kw) !== -1;
                if (!hit) return false;
            }
            // 分类匹配
            if (state.category !== "all" && c.category !== state.category) return false;
            // 价格区间
            if (state.price === "free" && !c.free) return false;
            if (state.price === "paid" && c.free) return false;
            if (state.price === "lte150" && c.price > 150) return false;
            if (state.price === "gt150" && c.price <= 150) return false;
            // 难度匹配
            if (state.level !== "all" && c.level !== state.level) return false;
            return true;
        });
    }

    function sortCourses(list) {
        var arr = list.slice();
        switch (state.sort) {
            case "priceAsc": arr.sort(function (a, b) { return a.price - b.price; }); break;
            case "priceDesc": arr.sort(function (a, b) { return b.price - a.price; }); break;
            case "studentsDesc": arr.sort(function (a, b) { return b.students - a.students; }); break;
            case "ratingDesc": arr.sort(function (a, b) { return b.rating - a.rating || b.students - a.students; }); break;
            default: break; // 默认按数据源顺序
        }
        return arr;
    }

    /* ========== 6) 课程卡片：复用 courses 卡片结构 ========== */
    function courseCardHtml(c) {
        var detailUrl = "course-detail.html?id=" + encodeURIComponent(c.id);
        var priceHtml = c.free
            ? '<span class="badge bg-success px-3 py-2">免费</span>'
            : "¥" + c.price.toFixed(2);
        var stars = "";
        for (var i = 0; i < 5; i++) {
            stars += '<small class="fa fa-star' + (i < c.rating ? " text-primary" : " text-muted") + '"></small>';
        }
        return '<div class="col-lg-4 col-md-6 col-sm-12">'
            + '<div class="course-item bg-light">'
            + '<div class="position-relative overflow-hidden">'
            + '<img class="img-fluid" src="' + esc(c.cover) + '" alt="' + esc(c.title) + '">'
            + '<div class="w-100 d-flex justify-content-center position-absolute bottom-0 start-0 mb-4">'
            + '<a href="' + detailUrl + '" class="flex-shrink-0 btn btn-sm btn-primary px-3 border-end" style="border-radius: 30px 0 0 30px;">了解更多</a>'
            + '<a href="' + detailUrl + '" class="flex-shrink-0 btn btn-sm btn-primary px-3" style="border-radius: 0 30px 30px 0;">立即加入</a>'
            + "</div>"
            + "</div>"
            + '<div class="text-center p-4 pb-0">'
            + "<h3 class=\"mb-0\">" + priceHtml + "</h3>"
            + '<div class="mb-3">' + stars + "<small>(" + c.ratingCount + ")</small></div>"
            + '<h5 class="mb-4">' + esc(c.title) + "</h5>"
            + "</div>"
            + '<div class="d-flex border-top">'
            + '<small class="flex-fill text-center border-end py-2"><i class="fa fa-user-tie text-primary me-2"></i>' + esc(c.instructor.name) + "</small>"
            + '<small class="flex-fill text-center border-end py-2"><i class="fa fa-clock text-primary me-2"></i>' + esc(c.duration) + "</small>"
            + '<small class="flex-fill text-center py-2"><i class="fa fa-user text-primary me-2"></i>' + c.students + " 名学员</small>"
            + "</div>"
            + "</div></div>";
    }

    /* ========== 7) 分页（前端 slice 切片） ========== */
    function renderPagination(total, totalPages) {
        var el = document.getElementById("pagination");
        if (totalPages <= 1) { el.innerHTML = ""; return; }

        function item(page, label, active, disabled) {
            return '<li class="page-item' + (active ? " active" : "") + (disabled ? " disabled" : "") + '">'
                + '<a class="page-link" href="javascript:;" data-page="' + page + '">' + label + "</a></li>";
        }
        var html = item(state.page - 1, '<i class="bi bi-chevron-left"></i>', false, state.page === 1);
        for (var i = 1; i <= totalPages; i++) {
            html += item(i, String(i), i === state.page, false);
        }
        html += item(state.page + 1, '<i class="bi bi-chevron-right"></i>', false, state.page === totalPages);
        el.innerHTML = html;
    }

    /* ========== 8) 统一渲染 + URL 同步 ========== */
    function render() {
        var filtered = sortCourses(filterCourses());
        var total = filtered.length;
        var totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
        if (state.page > totalPages) state.page = totalPages; // 防越界

        var pageItems = filtered.slice((state.page - 1) * PAGE_SIZE, state.page * PAGE_SIZE);

        var grid = document.getElementById("courseGrid");
        var empty = document.getElementById("emptyState");
        grid.innerHTML = pageItems.map(courseCardHtml).join("");
        grid.classList.toggle("d-none", total === 0);
        empty.classList.toggle("d-none", total !== 0);

        document.getElementById("resultInfo").textContent =
            "共 " + total + " 门课程 · 第 " + state.page + " / " + totalPages + " 页";
        renderPagination(total, totalPages);

        renderFilters();
        syncUrl();
    }

    /** 每次状态变化用 replaceState 写回 URL，刷新不丢条件 */
    function syncUrl() {
        try {
            var p = new URLSearchParams();
            if (state.keyword) p.set("q", state.keyword);
            if (state.category !== "all") p.set("category", state.category);
            if (state.price !== "all") p.set("price", state.price);
            if (state.level !== "all") p.set("level", state.level);
            if (state.sort !== "default") p.set("sort", state.sort);
            if (state.page > 1) p.set("page", String(state.page));
            var qs = p.toString();
            history.replaceState(null, "", "course-list.html" + (qs ? "?" + qs : ""));
        } catch (e) { }
    }

    /** 筛选变化：重置页码再渲染 */
    function updateState(patch) {
        var needResetPage = ["keyword", "category", "price", "level", "sort"].some(function (k) {
            return k in patch && patch[k] !== state[k];
        });
        for (var k in patch) state[k] = patch[k];
        if (needResetPage) state.page = 1;
        render();
    }

    /* ========== 9) 事件绑定 ========== */
    var searchTimer = null;
    document.getElementById("searchInput").addEventListener("input", function (e) {
        clearTimeout(searchTimer);
        var self = this;
        searchTimer = setTimeout(function () { updateState({ keyword: self.value }); }, 300);
    });

    document.getElementById("categoryList").addEventListener("click", function (e) {
        var btn = e.target.closest("[data-cat]");
        if (btn) updateState({ category: btn.getAttribute("data-cat") });
    });
    document.getElementById("priceList").addEventListener("click", function (e) {
        var btn = e.target.closest("[data-price]");
        if (btn) updateState({ price: btn.getAttribute("data-price") });
    });
    document.getElementById("levelList").addEventListener("click", function (e) {
        var btn = e.target.closest("[data-level]");
        if (btn) updateState({ level: btn.getAttribute("data-level") });
    });
    document.getElementById("sortSelect").addEventListener("change", function (e) {
        updateState({ sort: e.target.value });
    });

    document.getElementById("pagination").addEventListener("click", function (e) {
        var link = e.target.closest("[data-page]");
        if (!link) return;
        var page = parseInt(link.getAttribute("data-page"), 10);
        if (!page || page === state.page) return;
        updateState({ page: page });
        window.scrollTo({ top: 0, behavior: "smooth" });
    });

    function clearAll() {
        updateState({ keyword: "", category: "all", price: "all", level: "all", sort: "default", page: 1 });
    }
    document.getElementById("clearBtn").addEventListener("click", clearAll);
    document.getElementById("emptyClearBtn").addEventListener("click", clearAll);

    /* ========== 启动：JSON 数据优先加载后再渲染（fetch 失败自动回退内置数据） ========== */
    CourseData.ready.then(function () {
        render();
        document.getElementById("spinner").classList.remove("show");
    });
})();
</script>
</body>
</html>
