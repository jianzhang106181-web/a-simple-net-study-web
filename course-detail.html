<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>在线学习 - 课程详情</title>
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<meta content="" name="keywords">
<meta content="课程详情：章节目录、讲师介绍、课程价格与在线购买。" name="description">



<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
<link href="static/css/css2.css" rel="stylesheet">

<link href="static/css/all.min.css" rel="stylesheet">
<link href="static/css/bootstrap-icons.css" rel="stylesheet">

<link href="static/css/animate.min.css" rel="stylesheet">
<link href="static/css/owl.carousel.min.css" rel="stylesheet">

<link href="static/css/bootstrap.min.css" rel="stylesheet">

<link href="static/css/style.css" rel="stylesheet">
</head>
<body>

<div id="spinner" class="show bg-white position-fixed translate-middle w-100 vh-100 top-50 start-50 d-flex align-items-center justify-content-center">
<div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
<span class="sr-only">加载中...</span>
</div>
</div>


<div id="site-nav"></div>


<div class="container-fluid bg-primary py-5 mb-5 page-header">
<div class="container py-5">
<div class="row justify-content-center">
<div class="col-lg-10 col-md-12 col-sm-12 text-center">
<h1 class="display-3 text-white animated slideInDown">课程详情</h1>
<nav aria-label="breadcrumb">
<ol class="breadcrumb justify-content-center">
<li class="breadcrumb-item"><a class="text-white" href="index1.html">首页</a></li>
<li class="breadcrumb-item"><a class="text-white" href="courses.html">课程</a></li>
<li class="breadcrumb-item text-white active" aria-current="page" id="crumbTitle">课程详情</li>
</ol>
</nav>
</div>
</div>
</div>
</div>


<div class="container-xxl py-5">
<div class="container">

<!-- 课程不存在兜底（默认隐藏） -->
<div id="notFoundBlock" class="row justify-content-center d-none">
<div class="col-lg-6 col-md-8 col-sm-10 text-center">
<div class="bg-light rounded p-5">
<i class="fa fa-exclamation-circle fa-4x text-warning mb-4"></i>
<h3 class="mb-3">课程不存在</h3>
<p class="text-muted mb-4">您访问的课程可能已下架，或链接地址不正确。请返回课程列表浏览其他精彩课程。</p>
<a href="courses.html" class="btn btn-primary py-3 px-5"><i class="fa fa-arrow-left me-2"></i>返回课程列表</a>
</div>
</div>
</div>

<!-- 课程详情主体 -->
<div id="detailWrap" class="row g-5">

<!-- 左侧：封面 + 简介 + 章节目录 + 讲师（复用 about 图文排版） -->
<div class="col-lg-8 col-md-12 wow fadeInUp" data-wow-delay="0.1s">

<!-- 封面（about 的图文排版：图片区 + 文字区） -->
<div class="row g-5 mb-5">
<div class="col-12 wow fadeInUp" data-wow-delay="0.1s" style="min-height: 400px;">
<div class="position-relative h-100 rounded overflow-hidden">
<img class="img-fluid position-absolute w-100 h-100" id="courseCover" src="" alt="" style="object-fit: cover;">
<span id="freeBadge" class="badge bg-success position-absolute top-0 start-0 m-3 px-3 py-2 d-none">免费课程</span>
</div>
</div>
<div class="col-12 wow fadeInUp" data-wow-delay="0.3s">
<h6 class="section-title bg-white text-start text-primary pe-3">课程简介</h6>
<h1 class="mb-4" id="courseTitle"></h1>
<div class="d-flex flex-wrap gap-4 mb-4 text-muted">
<span><small class="fa fa-star text-primary me-1"></small><small class="fa fa-star text-primary me-1"></small><small class="fa fa-star text-primary me-1"></small><small class="fa fa-star text-primary me-1"></small><small class="fa fa-star text-primary me-1"></small><span id="courseRating"></span></span>
<span><i class="fa fa-user text-primary me-2"></i><span id="courseStudents"></span></span>
<span><i class="fa fa-clock text-primary me-2"></i><span id="courseDuration"></span></span>
<span><i class="fa fa-signal text-primary me-2"></i>难度：<span id="courseLevel"></span></span>
</div>
<div id="courseIntro"></div>
<div class="row gy-2 gx-4 mb-4 mt-2" id="courseHighlights"></div>
</div>
</div>

<!-- 章节目录（Accordion） -->
<div class="mb-5 wow fadeInUp" data-wow-delay="0.1s">
<h6 class="section-title bg-white text-start text-primary pe-3">章节目录</h6>
<h4 class="mb-4">课程内容（<span id="chapterStat"></span>）</h4>
<div class="accordion" id="chapterAccordion"></div>
</div>

<!-- 讲师（复用 about 图文排版） -->
<div class="wow fadeInUp" data-wow-delay="0.1s">
<h6 class="section-title bg-white text-start text-primary pe-3">讲师团队</h6>
<h4 class="mb-4">授课讲师</h4>
<div class="row g-5 align-items-center">
<div class="col-lg-4 col-md-5 col-sm-6" style="min-height: 260px;">
<div class="position-relative h-100 rounded overflow-hidden">
<img class="img-fluid position-absolute w-100 h-100" id="teacherAvatar" src="" alt="" style="object-fit: cover; object-position: top;">
</div>
</div>
<div class="col-lg-8 col-md-7 col-sm-6">
<h5 class="mb-1" id="teacherName"></h5>
<small class="text-primary d-block mb-3" id="teacherTitle"></small>
<p class="mb-0 text-muted" id="teacherIntro"></p>
</div>
</div>
</div>
</div>

<!-- 右侧：购买卡（sticky） -->
<div class="col-lg-4 col-md-12 align-self-start wow fadeInUp" data-wow-delay="0.3s">
<div class="bg-light rounded p-4 p-sm-5" style="position: sticky; top: 100px;">
<img id="buyCover" class="img-fluid rounded mb-4" src="" alt="">
<div class="d-flex justify-content-between align-items-center mb-2">
<h3 class="mb-0 text-primary" id="buyPrice"></h3>
<span id="ownedBadge" class="badge bg-success px-3 py-2 d-none"><i class="fa fa-check me-1"></i>已购买</span>
</div>
<p class="text-muted mb-4" id="buyMeta"></p>
<ul class="list-unstyled mb-4" id="buyIncludes"></ul>
<div id="buyAlert" class="alert d-none" role="alert"></div>
<button type="button" id="buyBtn" class="btn btn-primary w-100 py-3 mb-3"></button>
<small class="d-block text-center text-muted" id="buyHint"></small>
</div>
</div>

</div>
</div>
</div>


<div id="site-footer"></div>
<a href="#" class="btn btn-lg btn-primary btn-lg-square back-to-top"><i class="bi bi-arrow-up"></i></a>

<script src="static/js/jquery-3.4.1.min.js"></script>
<script src="static/js/bootstrap.bundle.min.js"></script>
<script src="static/js/wow.min.js"></script>
<script src="static/js/easing.min.js"></script>
<script src="static/js/waypoints.min.js"></script>
<script src="static/js/owl.carousel.min.js"></script>
<script src="static/js/main.js"></script>
<script src="static/js/auth.js"></script>
<script src="static/js/components.js"></script>
<script src="static/js/course-data.js"></script>
<script src="static/js/my-courses.js"></script>
<script>
(function () {
    "use strict";

    var esc = MyCourses.escapeHtml;
    var courseId = "";
    var course = null;

    try {
        courseId = new URLSearchParams(location.search).get("id") || "";
    } catch (e) { }

    /* JSON 数据加载（fetch 优先 / 内置兜底）完成后再渲染详情 */
    CourseData.ready.then(function () {

    course = CourseData.getById(courseId);

    /* ========== 课程不存在：显示提示 + 返回列表按钮，避免白屏 ========== */
    if (!course) {
        document.getElementById("detailWrap").classList.add("d-none");
        document.getElementById("notFoundBlock").classList.remove("d-none");
        document.getElementById("spinner").classList.remove("show");
        return;
    }

    /* ========== 基础信息渲染 ========== */
    document.title = "在线学习 - " + course.title;
    document.getElementById("crumbTitle").textContent = course.title;
    document.getElementById("courseCover").src = course.cover;
    document.getElementById("courseCover").alt = course.title;
    document.getElementById("buyCover").src = course.cover;
    document.getElementById("buyCover").alt = course.title;
    var avatarEl = document.getElementById("teacherAvatar");
    avatarEl.src = course.instructor.avatar;
    avatarEl.alt = "讲师" + course.instructor.name + "的照片";
    document.getElementById("courseTitle").textContent = course.title;
    document.getElementById("courseRating").textContent = course.ratingCount + " 条评价";
    document.getElementById("courseStudents").textContent = course.students + " 名学员";
    document.getElementById("courseDuration").textContent = course.duration;
    document.getElementById("courseLevel").textContent = course.level;
    document.getElementById("courseIntro").innerHTML =
        course.intro.map(function (p) { return '<p class="mb-4">' + esc(p) + "</p>"; }).join("");
    document.getElementById("courseHighlights").innerHTML =
        course.highlights.map(function (h) {
            return '<div class="col-sm-6"><p class="mb-0"><i class="fa fa-arrow-right text-primary me-2"></i>' + esc(h) + "</p></div>";
        }).join("");
    document.getElementById("chapterStat").textContent =
        course.chapters.length + " 个章节 · " + CourseData.lessonCount(course) + " 个课时 · 总时长 " + course.duration;

    /* ========== 章节目录（Accordion） ========== */
    var accHtml = course.chapters.map(function (ch, i) {
        var open = i === 0;
        var lessons = (ch.lessons || []).map(function (l, j) {
            var preview = (i === 0 && j === 0 && !MyCourses.has(course.id))
                ? '<span class="badge bg-primary text-white ms-2">可试看</span>'
                : '<i class="fa fa-lock text-muted ms-2"></i>';
            return '<li class="list-group-item bg-transparent px-0 py-2 d-flex justify-content-between align-items-center">'
                + '<span>' + esc(l) + preview + "</span>"
                + '<small class="text-muted"><i class="fa fa-play-circle text-primary me-1"></i>视频</small>'
                + "</li>";
        }).join("");
        return '<div class="accordion-item">'
            + '<h2 class="accordion-header" id="chHead' + i + '">'
            + '<button class="accordion-button' + (open ? "" : " collapsed") + '" type="button" data-bs-toggle="collapse" data-bs-target="#chBody' + i + '" aria-expanded="' + open + '">'
            + '<span class="fw-bold me-3">' + esc(ch.title) + "</span>"
            + '<small class="text-muted"><i class="fa fa-clock me-1"></i>' + esc(ch.duration) + " · " + ch.lessons.length + ' 课时</small>'
            + "</button></h2>"
            + '<div id="chBody' + i + '" class="accordion-collapse collapse' + (open ? " show" : "") + '" aria-labelledby="chHead' + i + '" data-bs-parent="#chapterAccordion">'
            + '<div class="accordion-body"><ul class="list-group list-group-flush">' + lessons + "</ul></div>"
            + "</div></div>";
    }).join("");
    document.getElementById("chapterAccordion").innerHTML = accHtml;

    /* ========== 讲师 ========== */
    document.getElementById("teacherAvatar").src = course.instructor.avatar;
    document.getElementById("teacherName").textContent = course.instructor.name;
    document.getElementById("teacherTitle").textContent = course.instructor.title;
    document.getElementById("teacherIntro").textContent = course.instructor.intro;

    /* ========== 右侧购买卡 ========== */
    document.getElementById("buyCover").src = course.cover;
    document.getElementById("buyCover").alt = course.title;
    document.getElementById("buyMeta").textContent =
        course.category + " · " + course.level + " · " + CourseData.lessonCount(course) + " 个课时";

    var priceText = course.free ? "免费" : "¥" + course.price.toFixed(2);
    document.getElementById("buyPrice").textContent = priceText;
    document.getElementById("buyIncludes").innerHTML = [
        '<li class="mb-2"><i class="fa fa-check text-primary me-2"></i>' + course.chapters.length + " 个章节 · " + CourseData.lessonCount(course) + " 个课时</li>",
        '<li class="mb-2"><i class="fa fa-check text-primary me-2"></i>购买后永久回放</li>',
        '<li class="mb-2"><i class="fa fa-check text-primary me-2"></i>配套资料下载</li>',
        '<li class="mb-2"><i class="fa fa-check text-primary me-2"></i>结业证书</li>',
        '<li class="mb-2"><i class="fa fa-check text-primary me-2"></i>讲师答疑服务</li>'
    ].join("");

    var buyBtn = document.getElementById("buyBtn");
    var buyAlert = document.getElementById("buyAlert");
    var ownedBadge = document.getElementById("ownedBadge");
    var buyHint = document.getElementById("buyHint");

    function showAlert(type, text) {
        buyAlert.className = "alert alert-" + type;
        buyAlert.textContent = text;
        buyAlert.classList.remove("d-none");
    }
    function hideAlert() {
        buyAlert.classList.add("d-none");
    }
    /** 保留 ?id 参数回跳（配合 auth.js 支持带参数的 next） */
    function currentUrl() {
        return "course-detail.html?id=" + encodeURIComponent(course.id);
    }
    function goLogin() {
        location.href = "login.html?next=" + encodeURIComponent(currentUrl());
    }

    /* 三态按钮：① 未购买 + 收费 → 立即购买；② 免费课 → 免费学习；③ 已购买 → 继续学习 */
    function renderBuyState() {
        var purchased = MyCourses.has(course.id);
        ownedBadge.classList.toggle("d-none", !purchased);
        hideAlert();

        if (purchased) {
            buyBtn.innerHTML = '<i class="fa fa-play me-2"></i>继续学习';
            buyHint.textContent = "购买成功，随时可以继续学习。";
        } else if (course.free) {
            buyBtn.innerHTML = '<i class="fa fa-gift me-2"></i>免费学习';
            buyHint.textContent = "免费课程，登录后即可开始学习。";
        } else {
            buyBtn.innerHTML = '<i class="fa fa-shopping-cart me-2"></i>立即购买';
            buyHint.textContent = "一次购买，永久有效，支持随时回看。";
        }
    }

    buyBtn.addEventListener("click", function () {
        /* 未登录拦截：先去登录，登录后回跳本页 */
        if (!Auth.isLoggedIn()) {
            goLogin();
            return;
        }

        if (MyCourses.has(course.id)) {
            location.href = "learn.html?id=" + encodeURIComponent(course.id);
            return;
        }

        if (course.free) {
            if (MyCourses.add(course.id)) {
                renderBuyState();
                showAlert("success", "已成功加入课程，即将进入学习页...");
                setTimeout(function () {
                    location.href = "learn.html?id=" + encodeURIComponent(course.id);
                }, 900);
            } else {
                showAlert("danger", "加入失败：浏览器存储不可用，请检查浏览器设置。");
            }
            return;
        }

        /* 收费课程：模拟购买流程 */
        if (confirm("确认以 ¥" + course.price.toFixed(2) + " 购买《" + course.title + "》吗？")) {
            if (MyCourses.add(course.id)) {
                renderBuyState();
                showAlert("success", "购买成功！课程已加入您的课程列表。");
            } else {
                showAlert("danger", "购买失败：浏览器存储不可用，请检查浏览器设置。");
            }
        }
    });

    renderBuyState();
    document.getElementById("spinner").classList.remove("show");
    }); /* end CourseData.ready.then */
})();
</script>
</body>
</html>
